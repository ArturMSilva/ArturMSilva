name: Generate Contribution Snake

on:
  schedule:
    # A cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Gera os SVGs da cobrinha
        uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Primeira cor de color_dots = celula vazia.
          # No dark ela precisa ser um slate visivel (#2d3343), senao
          # a grade some contra o fundo #0d1117 do GitHub.
          outputs: |
            dist/snake-dark.svg?color_snake=%2322D3EE&color_dots=%232d3343,%234c1d95,%236d28d9,%237C3AED,%23A78BFA
            dist/snake-light.svg?color_snake=%230891B2&color_dots=%23ebedf0,%23ddd6fe,%23c4b5fd,%238b5cf6,%237C3AED

      - name: Publica na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
